<style>
.oplog-notices{margin-bottom:calc(14px * var(--ui-scale,1))}
.oplog-filter-panel{margin-bottom:calc(14px * var(--ui-scale,1))}
.oplog-tools{display:flex;flex-wrap:wrap;gap:calc(10px * var(--ui-scale,1)) calc(12px * var(--ui-scale,1));align-items:flex-end;padding:calc(16px * var(--ui-scale,1)) calc(19px * var(--ui-scale,1))}
.oplog-tools .field{margin:0;min-width:calc(130px * var(--ui-scale,1));flex:0 1 auto}
.oplog-tools .field input,.oplog-tools .field select{width:100%;min-width:calc(120px * var(--ui-scale,1))}
.oplog-tools label{font-size:calc(12px * var(--ui-scale,1));color:var(--muted);display:block;margin-bottom:4px}
.oplog-tools .field-oplog-keyword{min-width:calc(180px * var(--ui-scale,1));flex:1 1 calc(180px * var(--ui-scale,1))}
.oplog-tools .oplog-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-bottom:2px}
.oplog-table-compact{min-width:980px!important;table-layout:fixed;width:100%}
.oplog-table-compact .col-time{width:132px;min-width:132px}
.oplog-table-compact .col-user{width:76px;min-width:76px}
.oplog-table-compact .col-module{width:96px;min-width:96px}
.oplog-table-compact .col-action{width:68px;min-width:68px}
.oplog-table-compact .col-biz{width:128px;min-width:128px}
.oplog-table-compact .col-msg{width:auto;min-width:220px;white-space:normal;line-height:1.55}
.oplog-table-compact .col-result{width:52px;min-width:52px;text-align:center}
.oplog-table-compact .col-op{width:56px;min-width:56px;text-align:center}
.oplog-table-compact td,.oplog-table-compact th{overflow:hidden;text-overflow:ellipsis;vertical-align:top}
.oplog-msg-cell{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.oplog-biz-cell{line-height:1.45;word-break:break-all}
.oplog-biz-code{font-weight:600}
.oplog-biz-name{color:var(--muted);font-size:calc(12px * var(--ui-scale,1))}
.oplog-fail{color:var(--red);font-weight:600}
tr.oplog-row-fail td{color:var(--red)}
.oplog-pager{display:flex;align-items:center;gap:10px;padding:0 calc(19px * var(--ui-scale,1)) calc(14px * var(--ui-scale,1));flex-wrap:wrap}
.oplog-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.oplog-detail-block{padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:#f8fafc;line-height:1.75;font-size:calc(13px * var(--ui-scale,1))}
.oplog-detail-block.full{grid-column:1/-1}
.oplog-detail-block .block-title{font-weight:700;margin:0 0 8px;color:var(--text);font-size:calc(13px * var(--ui-scale,1))}
.oplog-detail-row{display:flex;gap:8px;margin:4px 0}
.oplog-detail-row .k{flex:0 0 88px;color:var(--muted)}
.oplog-detail-row .v{flex:1;word-break:break-all}
.oplog-json-pre{margin:0;padding:10px 12px;background:#1e293b;color:#e2e8f0;border-radius:6px;font-size:12px;line-height:1.55;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-all}
@media(max-width:720px){.oplog-detail-grid{grid-template-columns:1fr}}
</style>
<div id="systemSettingOperationLogPanel" style="display:none">
<div class="oplog-notices">
<div class="notice"><span>操作记录用于查看谁在什么时间新增、修改、删除、导入、导出或清空了数据。可按模块筛选，如「售后维修工单」。</span></div>
<div class="notice page-tip-orange"><span>列表默认只显示常用列；IP、UserAgent、业务 ID、完整 JSON 等请点「详情」查看。导出 CSV 仍含完整字段。</span></div>
</div>
<div class="panel oplog-filter-panel">
<div class="oplog-tools">
<div class="field"><label>开始日期</label><input type="date" id="oplogFrom"></div>
<div class="field"><label>结束日期</label><input type="date" id="oplogTo"></div>
<div class="field"><label>操作人</label><input id="oplogUsername" placeholder="账号"></div>
<div class="field"><label>模块</label><input id="oplogModule" placeholder="如：售后维修工单"></div>
<div class="field"><label>操作类型</label><input id="oplogAction" placeholder="如：新增"></div>
<div class="field"><label>结果</label><select id="oplogResult"><option value="">全部</option><option value="Success">成功</option><option value="Failed">失败</option></select></div>
<div class="field field-oplog-keyword"><label>关键字</label><input id="oplogKeyword" placeholder="单号/客户/摘要"></div>
<div class="oplog-actions">
<button type="button" class="btn primary" id="oplogSearchBtn">查询</button>
<button type="button" class="btn" id="oplogExportBtn">导出 CSV</button>
<button type="button" class="btn" id="oplogResetBtn">重置</button>
</div>
</div>
</div>
<div class="panel">
<div class="dual-scroll" id="oplogDualScroll"><div class="table-scroll-top" id="oplogScrollTop"><div class="table-scroll-inner" id="oplogScrollInner"></div></div><div class="tablewrap" id="oplogTableWrap"><table class="data-table oplog-table-compact"><thead><tr><th class="col-time">时间</th><th class="col-user">操作人</th><th class="col-module">模块</th><th class="col-action">操作类型</th><th class="col-biz">业务单号/名称</th><th class="col-msg">摘要</th><th class="col-result">结果</th><th class="col-op">操作</th></tr></thead><tbody id="oplogListBody"><tr><td colspan="8" class="empty">加载中...</td></tr></tbody></table></div></div>
<div class="foot"><span id="oplogCountText">共 0 条</span><span id="oplogPageSummary">第 1 页</span></div>
<div class="oplog-pager"><button type="button" class="btn" id="oplogPrevBtn">上一页</button><span id="oplogPageText">第 1 / 1 页</span><button type="button" class="btn" id="oplogNextBtn">下一页</button></div>
</div>
</div>
<div class="modal" id="oplogDetailModal"><div class="dialog" style="width:min(96vw,calc(720px * var(--ui-scale,1)))"><div class="dialoghead"><div class="dialogtitle">操作记录详情</div><button class="close" id="oplogDetailClose">×</button></div><div class="form" id="oplogDetailBox" style="padding-top:16px"></div><div class="dialogfoot"><button type="button" class="btn" id="oplogDetailOk">关闭</button></div></div></div>
<script>
(function(){
var panel=document.getElementById('systemSettingOperationLogPanel');
var detail=document.getElementById('systemSettingsDetail');
var placeholder=document.getElementById('systemSettingPlaceholderPanel');
if(panel&&detail){if(placeholder&&placeholder.parentNode)placeholder.parentNode.insertBefore(panel,placeholder);else detail.appendChild(panel);}
var oplogPage=1,oplogPageSize=50,oplogTotal=0;
var OLOG_ENTITY_LABELS={AfterSalesServiceOrder:'售后维修工单',Supplier:'供应商',Customer:'客户',Material:'物料',SalesOrder:'销售订单',SalesOutbound:'销售出库',PurchaseOrder:'采购单',PurchaseInbound:'采购入库',ProductionPick:'生产领用',FinishedInbound:'成品入库',Receivable:'应收款',Payable:'应付款',DataMaintenance:'数据工具',Session:'登录会话'};
function qs(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function dash(v){var s=v==null?'':String(v).trim();return s?s:'-'}
function oplogUserShort(x){return esc(dash(x.DisplayName||x.Username))}
function oplogEntityLabel(t){return esc(dash(OLOG_ENTITY_LABELS[t]||t))}
function oplogResultLabel(r){return r==='Failed'?'<span class="oplog-fail">失败</span>':esc(r==='Success'?'成功':dash(r))}
function oplogBizCell(x){
  var code=dash(x.EntityCode),name=dash(x.EntityName);
  if(code==='-'&&name==='-')return '-';
  if(code!=='-'&&name!=='-'&&code!==name)return '<div class="oplog-biz-cell"><div class="oplog-biz-code">'+esc(code)+'</div><div class="oplog-biz-name">'+esc(name)+'</div></div>';
  return '<div class="oplog-biz-cell">'+esc(code!=='-'?code:name)+'</div>';
}
function looksLikeJson(s){s=String(s||'').trim();return (s.startsWith('{')&&s.endsWith('}'))||(s.startsWith('[')&&s.endsWith(']'))}
function formatJsonBlock(label,val){
  if(!val||String(val).trim()===''||String(val).trim()==='-')return '';
  var raw=String(val).trim();
  var pretty=raw;
  if(looksLikeJson(raw)){try{pretty=JSON.stringify(JSON.parse(raw),null,2)}catch(e){pretty=raw}}
  return '<div class="oplog-detail-row"><span class="k">'+esc(label)+'</span><span class="v"><pre class="oplog-json-pre">'+esc(pretty)+'</pre></span></div>';
}
function buildQuery(page){
  var p=new URLSearchParams();
  var from=qs('oplogFrom'),to=qs('oplogTo'),u=qs('oplogUsername'),m=qs('oplogModule'),a=qs('oplogAction'),r=qs('oplogResult'),k=qs('oplogKeyword');
  if(from&&from.value)p.set('from',from.value);
  if(to&&to.value)p.set('to',to.value);
  if(u&&u.value.trim())p.set('username',u.value.trim());
  if(m&&m.value.trim())p.set('module',m.value.trim());
  if(a&&a.value.trim())p.set('action',a.value.trim());
  if(r&&r.value)p.set('result',r.value);
  if(k&&k.value.trim())p.set('keyword',k.value.trim());
  p.set('page',String(page||1));
  p.set('pageSize',String(oplogPageSize));
  return p.toString();
}
function updatePager(page,total){
  oplogPage=page;oplogTotal=total||0;
  var pages=Math.max(1,Math.ceil(oplogTotal/oplogPageSize));
  if(qs('oplogPageText'))qs('oplogPageText').textContent='第 '+page+' / '+pages+' 页';
  if(qs('oplogPageSummary'))qs('oplogPageSummary').textContent='第 '+page+' / '+pages+' 页 · 共 '+oplogTotal+' 条';
  if(qs('oplogPrevBtn'))qs('oplogPrevBtn').disabled=(page<=1);
  if(qs('oplogNextBtn'))qs('oplogNextBtn').disabled=(page>=pages);
}
function refreshOplogScroll(){if(typeof bindDualScroll==='function')setTimeout(function(){bindDualScroll('oplogDualScroll')},0)}
function renderOplogDetail(d){
  var box=qs('oplogDetailBox');if(!box)return;
  var userLabel=esc(dash((d.DisplayName||'')+(d.Username?(' ('+d.Username+')'):'')));
  var detailJson='';
  try{detailJson=JSON.stringify({Module:d.Module,Action:d.Action,EntityType:d.EntityType,EntityId:d.EntityId,EntityCode:d.EntityCode,EntityName:d.EntityName,Result:d.Result,Message:d.Message,Error:d.Error,Api:d.Api,BackupPath:d.BackupPath},null,2)}catch(e){detailJson=String(d.Message||'')}
  box.innerHTML='<div class="oplog-detail-grid">'
    +'<div class="oplog-detail-block"><div class="block-title">基本信息</div>'
    +'<div class="oplog-detail-row"><span class="k">时间</span><span class="v">'+esc(dash(d.Time))+'</span></div>'
    +'<div class="oplog-detail-row"><span class="k">操作人</span><span class="v">'+userLabel+'</span></div>'
    +'<div class="oplog-detail-row"><span class="k">模块</span><span class="v">'+esc(dash(d.Module))+'</span></div>'
    +'<div class="oplog-detail-row"><span class="k">操作类型</span><span class="v">'+esc(dash(d.Action))+'</span></div>'
    +'<div class="oplog-detail-row"><span class="k">结果</span><span class="v">'+oplogResultLabel(d.Result)+'</span></div>'
    +'<div class="oplog-detail-row"><span class="k">IP</span><span class="v">'+esc(dash(d.Ip))+'</span></div>'
    +'<div class="oplog-detail-row"><span class="k">UserAgent</span><span class="v">'+esc(dash(d.UserAgent))+'</span></div></div>'
    +'<div class="oplog-detail-block"><div class="block-title">业务信息</div>'
    +'<div class="oplog-detail-row"><span class="k">业务 ID</span><span class="v">'+esc(dash(d.EntityId))+'</span></div>'
    +'<div class="oplog-detail-row"><span class="k">业务单号</span><span class="v">'+esc(dash(d.EntityCode))+'</span></div>'
    +'<div class="oplog-detail-row"><span class="k">业务名称</span><span class="v">'+esc(dash(d.EntityName))+'</span></div>'
    +'<div class="oplog-detail-row"><span class="k">业务类型</span><span class="v">'+oplogEntityLabel(d.EntityType)+'</span></div>'
    +'<div class="oplog-detail-row"><span class="k">来源接口</span><span class="v">'+esc(dash(d.Api))+'</span></div></div>'
    +'<div class="oplog-detail-block full"><div class="block-title">详细内容</div>'
    +'<div class="oplog-detail-row"><span class="k">摘要</span><span class="v">'+esc(dash(d.Message))+'</span></div>'
    +'<div class="oplog-detail-row"><span class="k">失败原因</span><span class="v">'+esc(dash(d.Error))+'</span></div>'
    +'<div class="oplog-detail-row"><span class="k">备份路径</span><span class="v">'+esc(dash(d.BackupPath))+'</span></div>'
    +formatJsonBlock('记录 JSON',detailJson)
    +'</div></div>';
}
function openOplogDetailModal(){var m=qs('oplogDetailModal');if(m)m.classList.add('show')}
function closeOplogDetailModal(){if(window.erpUiLock&&!window.erpUiLock.guardClose())return;var m=qs('oplogDetailModal');if(m)m.classList.remove('show');if(!document.querySelector('.modal.show'))document.body.style.overflow=''}
function canViewOperationLogs(){return typeof isAdminUser==='function'&&isAdminUser()}
function applyOplogPermissions(){var ok=canViewOperationLogs();if(qs('oplogExportBtn'))qs('oplogExportBtn').style.display=ok?'':'none';if(qs('oplogSearchBtn'))qs('oplogSearchBtn').style.display=ok?'':'none'}
async function loadLogs(page){
  var body=qs('oplogListBody');if(!body)return;
  if(!canViewOperationLogs()){body.innerHTML=window.erpEmptyHtml?window.erpEmptyHtml(8,'perm'):'<tr><td colspan="8" class="empty">当前账号没有权限查看此页面。</td></tr>';if(qs('oplogCountText'))qs('oplogCountText').textContent='共 0 条';applyOplogPermissions();return}
  body.innerHTML=window.erpEmptyHtml?window.erpEmptyHtml(8,'loading'):'<tr><td colspan="8" class="empty">加载中...</td></tr>';
  try{
    var data=await api('/api/operation-logs?'+buildQuery(page));
    var items=(data&&data.Items)||[];
    var total=(data&&data.Total)||0;
    updatePager(page,total);
    if(!items.length){body.innerHTML=window.erpEmptyHtml?window.erpEmptyHtml(8,'oplog'):'<tr><td colspan="8" class="empty">暂无操作记录。可调整筛选条件后再查询。</td></tr>';if(qs('oplogCountText'))qs('oplogCountText').textContent='共 0 条';refreshOplogScroll();return}
    body.innerHTML=items.map(function(x){
      var failed=x.Result==='Failed';
      var rowCls=failed?' class="oplog-row-fail"':'';
      return '<tr'+rowCls+'><td class="col-time">'+esc(x.Time)+'</td><td class="col-user">'+oplogUserShort(x)+'</td><td class="col-module">'+esc(x.Module||'-')+'</td><td class="col-action">'+esc(x.Action||'-')+'</td><td class="col-biz">'+oplogBizCell(x)+'</td><td class="col-msg"><div class="oplog-msg-cell">'+esc(x.Message||'-')+'</div></td><td class="col-result">'+oplogResultLabel(x.Result)+'</td><td class="col-op"><button type="button" class="btn linkbtn oplog-detail-btn" data-id="'+esc(x.Id)+'">详情</button></td></tr>';
    }).join('');
    if(qs('oplogCountText'))qs('oplogCountText').textContent='共 '+total+' 条';
    body.querySelectorAll('.oplog-detail-btn').forEach(function(btn){
      btn.onclick=async function(){
        var id=btn.getAttribute('data-id');if(!id)return;
        try{
          var d=await api('/api/operation-logs/'+encodeURIComponent(id));
          renderOplogDetail(d||{});
          openOplogDetailModal();
        }catch(e){tip(e.message||'加载详情失败')}
      };
    });
    refreshOplogScroll();
  }catch(e){body.innerHTML=window.erpEmptyHtml?window.erpEmptyHtml(8,'error'):'<tr><td colspan="8" class="empty">页面加载失败，请刷新后重试。</td></tr>';tip(e.message||'加载失败','error');refreshOplogScroll()}
}
window.loadOperationLogs=function(page){return loadLogs(page||1)};
if(qs('oplogSearchBtn'))qs('oplogSearchBtn').onclick=function(){loadLogs(1)};
if(qs('oplogResetBtn'))qs('oplogResetBtn').onclick=function(){['oplogFrom','oplogTo','oplogUsername','oplogModule','oplogAction','oplogKeyword'].forEach(function(id){var el=qs(id);if(el)el.value=''});if(qs('oplogResult'))qs('oplogResult').value='';closeOplogDetailModal();loadLogs(1)};
if(qs('oplogExportBtn'))qs('oplogExportBtn').onclick=function(){if(!canViewOperationLogs()){tip('无权限操作','error');return}window.open('/api/operation-logs/export?'+buildQuery(oplogPage),'_blank')};
applyOplogPermissions();
if(qs('oplogPrevBtn'))qs('oplogPrevBtn').onclick=function(){if(oplogPage>1)loadLogs(oplogPage-1)};
if(qs('oplogNextBtn'))qs('oplogNextBtn').onclick=function(){var pages=Math.max(1,Math.ceil(oplogTotal/oplogPageSize));if(oplogPage<pages)loadLogs(oplogPage+1)};
if(qs('oplogDetailClose'))qs('oplogDetailClose').onclick=closeOplogDetailModal;
if(qs('oplogDetailOk'))qs('oplogDetailOk').onclick=closeOplogDetailModal;
document.addEventListener('keydown',function(e){if(e.key==='Escape'){var m=qs('oplogDetailModal');if(m&&m.classList.contains('show')){e.preventDefault();closeOplogDetailModal()}}});
})();
</script>
