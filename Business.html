<style>
.biz-table{min-width:1080px!important}

html[data-size="xlarge"]{--cell-ellipsis-w:240px}
.biz-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:8px}

.biz-detail-item div{word-break:break-word;line-height:1.5}

.stock-row-negative td{background:#fff5f5}

.stock-status-out{color:var(--red);font-weight:600}
.stock-status-low{color:#b45309;font-weight:600}

.stock-negative-hint{background:#fff8f8!important;border-color:#f0d4d4!important;color:#8a3a3a!important}

.arap-detail-tablewrap{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:8px}

#salesOrderView>.panel,#salesOutboundView>.panel,#purchaseOrderView>.panel,#purchaseInboundView>.panel,#productionPickView>.panel,#finishedInboundView>.panel,#productionWorkOrderView>.panel,#receivableView>.panel,#payableView>.panel,#stockView>.panel{overflow:hidden}
#soDualScroll,#soutDualScroll,#poDualScroll,#pinDualScroll,#ppDualScroll,#finDualScroll,#pwoDualScroll,#asoDualScroll,#recDualScroll,#payDualScroll,#stockDualScroll{max-width:100%;overflow:hidden;flex-shrink:0}

.biz-section-title{font-size:calc(13px * var(--ui-scale,1));font-weight:700;color:#516176;margin:16px 0 10px;padding-left:9px;border-left:3px solid var(--blue);grid-column:1/-1}
.biz-auto-tag{display:inline-block;margin-left:6px;font-size:calc(11px * var(--ui-scale,1));color:var(--muted);font-weight:400}

.biz-cost-collapse{grid-column:1/-1;margin-top:4px}
.biz-cost-toggle{border:0;background:transparent;color:var(--blue);cursor:pointer;font-size:calc(13px * var(--ui-scale,1));padding:4px 0}
.biz-cost-panel{display:none;grid-column:1/-1}
.biz-cost-panel.open{display:grid;grid-template-columns:1fr 1fr;gap:15px 18px}
.biz-stock-hint{grid-column:1/-1;padding:10px 12px;border-radius:8px;background:#f8fafc;border:1px solid var(--line);font-size:calc(13px * var(--ui-scale,1));line-height:1.6}
.biz-stock-hint.warn{background:#fff5f5;border-color:#fecaca;color:#991b1b}
.biz-field-hidden{display:none!important}
.panel>.tools{align-items:center;flex-wrap:wrap}
.panel>.tools .righttools{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end;flex:1 1 auto;min-width:0}
.panel>.tools .lefttools{flex:0 1 auto;min-width:0}
.panel>.tools .search{flex:0 1 auto;min-width:calc(180px * var(--ui-scale,1));max-width:min(calc(315px * var(--ui-scale,1)),100%)}
.action.next-action,.btn.next-action{color:#15803d;border-color:#bbf7d0;background:#f0fdf4;font-weight:600}

.biz-next-detail label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}

@media(max-width:720px){.biz-cost-panel.open{grid-template-columns:1fr}}

<script>
(function(){
var DOC_STATUS=['草稿','已确认','已取消'];
var BIZ_CONFIRM_STATUS_VIEWS=['salesOrderView','salesOutboundView','purchaseOrderView','purchaseInboundView','productionPickView','finishedInboundView'];
function bizNeedsConfirmStatus(cfg,body,isEdit,st){
if(BIZ_CONFIRM_STATUS_VIEWS.indexOf(cfg.view)<0||body.Status!=='已确认')return false;
var prev='';
if(isEdit&&st.editing){var orig=(bizEnsureState(cfg.view).data||[]).find(function(x){return x.Id===st.editing});prev=orig?orig.Status||'':'';}
return prev!=='已确认';
}
var BIZ_DELETE_LINK_VIEWS=['salesOrderView','salesOutboundView','purchaseOrderView','purchaseInboundView','productionPickView','finishedInboundView'];
var BIZ_IMPACT_MODULE={'salesOrderView':'salesOrder','salesOutboundView':'salesOutbound','purchaseOrderView':'purchaseOrder','purchaseInboundView':'purchaseInbound','productionPickView':'productionPick','finishedInboundView':'finishedInbound','receivableView':'receivable','payableView':'payable'};
function bizImpactModule(cfg){return cfg&&BIZ_IMPACT_MODULE[cfg.view]?BIZ_IMPACT_MODULE[cfg.view]:'';}
var BIZ_PAGE_TIPS={
'salesOrderView':{blue:'销售订单用于记录客户要买什么；保存后会自动生成应收款。',flow:'现货/配件：销售订单 → 销售出库 → 应收；需要生产：销售订单 → 生产工单 → 领用/入库 → 销售出库。',orange:'订单已出库或已收款后，关键内容不能随意修改或删除。'},
'salesOutboundView':{blue:'销售出库记录实际发了什么货；确认后才扣库存。',orange:'库存不足时不能出库；已确认出库单不能随意删除。'},
'purchaseOrderView':{blue:'采购单记录采购计划，实际到货请去采购入库确认；保存后会自动生成应付款。',flow:'采购单 → 采购入库 → 应付款 → 付款。',orange:'采购单已入库或已付款后，关键内容不能随意修改或删除。'},
'purchaseInboundView':{blue:'采购入库确认后增加库存；草稿或未确认不参与库存计算。',flow:'路径A：选来源采购单 → 填本次入库数量；路径B：不关联采购单 → 选手动供应商与物料。',orange:'已确认入库单不能随意删除，避免库存错账。'},
'productionPickView':{blue:'生产领用用于记录车间实际用了哪些材料；确认后才扣原材料库存。',flow:'领料完成后，可到成品入库登记生产完成的设备。',orange:'库存不足不能领用；已确认领用单不能随意删除。'},
'finishedInboundView':{blue:'成品入库用于记录生产完成的设备/成品；确认后才增加成品库存。',flow:'成品入库后，可到销售出库发货给客户。',orange:'已确认成品入库单不能随意删除，避免库存错账。'},
'receivableView':{blue:'应收款记录客户欠多少钱；实际收到钱后请登记收款明细。',flow:'客户欠款在这里看，收到钱请点「登记收款」或「下一步：登记收款」。',orange:'收款不能超过应收金额；有收款明细后不能随意删除应收单。'},
'payableView':{blue:'应付款记录欠供应商多少钱；实际付款后请登记付款明细。',flow:'欠供应商的钱在这里看，付款后请点「登记付款」或「下一步：登记付款」。',orange:'付款不能超过应付金额；有付款明细后不能随意删除应付单。'},
'stockView':{blue:'库存汇总为只读结果页，由采购入库、成品入库、销售出库、生产领用自动计算。',flow:'采购入库/成品入库 → 库存增加；销售出库/生产领用 → 库存减少。不建议手工修改库存。',orange:'负库存表示出库/领用超过当前库存，请检查相关单据。'}
};
function bizPageTipsHtml(view){
var t=BIZ_PAGE_TIPS[view];if(!t)return '';
var h='<div class="notice page-tip-blue"><span>'+safe(t.blue)+'</span></div>';
if(t.flow)h+='<div class="notice"><span><b>流程提示：</b>'+safe(t.flow)+'</span></div>';
if(t.orange)h+='<div class="notice page-tip-orange"><span>'+safe(t.orange)+'</span></div>';
return h;
}
var BIZ_NEXT_NAV_KEY='guanyu-next-nav';
function bizSetNextNav(page,payload){try{sessionStorage.setItem(BIZ_NEXT_NAV_KEY,JSON.stringify({page:page,payload:payload||{},ts:Date.now()}));}catch(e){}}
function bizPeekNextNav(page){try{var raw=sessionStorage.getItem(BIZ_NEXT_NAV_KEY);if(!raw)return null;var o=JSON.parse(raw);if(!o||o.page!==page)return null;return o.payload||{};}catch(e){return null}}
function bizConsumeNextNav(page){var p=bizPeekNextNav(page);if(p){try{sessionStorage.removeItem(BIZ_NEXT_NAV_KEY);}catch(e){}}return p}
window.bizGoNextPage=function(page,payload){bizSetNextNav(page,payload||{});if(typeof openPage==='function')openPage(page);};
function bizNextBtn(label,fnCall){var cls='action next-action'+(label==='转出库'||label==='转入库'?' action-transfer':'');return'<button type="button" class="'+cls+'" onclick="'+fnCall+'">'+safe(label)+'</button>';}
function bizBuildDetailNextHtml(cfg,item){
var btns=bizBuildListNextActions(cfg,item,true);if(!btns)return '';
return'<div class="biz-next-detail full"><label>下一步操作（只跳转/预填，不会自动生成单据）</label><div class="biz-next-btns">'+btns+'</div></div>';
}
function bizBuildListNextActions(cfg,x,detailMode){
if(!x||x.Status==='已取消')return '';
var acts='',id=safe(x.Id);
if(cfg.view==='salesOrderView'){
if(x.Status==='已确认'&&can('sales_outbound.add')){
var remSo=bizSalesOrderRemaining(x);
if(remSo>0&&can('sales_outbound.view')){
acts+=bizNextBtn('转出库','bizTransferSalesOrderToOutbound(\''+id+'\')');
}
}
if(x.ItemType==='FinishedProduct'){
if(can('production_pick.view'))acts+=bizNextBtn('下一步：生产工单','bizNextFromSalesOrder(\''+id+'\',\'pwo\')');
}else if(x.ItemType==='Material'){
if(!detailMode&&can('production_pick.view'))acts+=bizNextBtn('前往生产工单','bizNextFromSalesOrder(\''+id+'\',\'pwo\')');
if(!detailMode)acts+='<span class="mini" style="display:block;margin-top:4px;color:var(--muted)">现货/配件可直接转出库；需车间生产的设备先建生产工单。</span>';
}else{
if(can('production_pick.view'))acts+=bizNextBtn('前往生产工单','bizNextFromSalesOrder(\''+id+'\',\'pwo\')');
if(!detailMode)acts+='<span class="mini" style="display:block;margin-top:4px;color:var(--muted)">现货/配件直接转出库；需要车间生产的设备先建生产工单。</span>';
}
}
if(cfg.view==='purchaseOrderView'&&x.Status==='已确认'&&can('purchase_inbound.add')){
var remPo=bizPurchaseOrderRemaining(x);
if(remPo>0&&can('purchase_inbound.view'))acts+=bizNextBtn('转入库','bizTransferPurchaseOrderToInbound(\''+id+'\')');
}
if(cfg.view==='receivableView'&&numVal(x.UnreceivedAmount)>0.0001&&arapDetailCan('receipt','view')){
acts+=bizNextBtn('下一步：登记收款','bizNextRegisterReceipt(\''+id+'\')');
}
if(cfg.view==='payableView'&&numVal(x.UnpaidAmount)>0.0001&&arapDetailCan('payment','view')){
acts+=bizNextBtn('下一步：登记付款','bizNextRegisterPayment(\''+id+'\')');
}
return acts;
}
window.bizNextFromSalesOrder=async function(orderId,action){
if(!can('sales_order.view')){tip('无权限操作');return}
if(!bizRefs.salesOrders.length)await bizLoadRefs();
var order=(bizRefs.salesOrders||[]).find(function(x){return bizStr(x.Id)===bizStr(orderId)});
if(!order){tip('销售订单不存在');return}
var code=order.Code||'';
if(action==='outbound'){
if(!can('sales_outbound.view')){tip('无权限访问销售出库');return}
bizGoNextPage('sales-outbound',{search:code,openAdd:!!can('sales_outbound.add'),prefill:{SalesOrderId:order.Id,Status:'草稿'}});
}else if(action==='pwo'){
if(!can('production_pick.view')){tip('无权限访问生产工单');return}
bizGoNextPage('production-work-order',{search:code,openAdd:!!can('production_pick.add'),prefill:{SourceType:'销售订单',SalesOrderId:order.Id}});
}
};
window.bizNextFromPurchaseOrder=async function(poId){
if(!can('purchase_order.view')){tip('无权限操作');return}
await bizTransferPurchaseOrderToInbound(poId);
};
window.bizTransferSalesOrderToOutbound=async function(orderId){
if(!can('sales_order.view')){tip('无权限操作');return}
if(!bizRefs.salesOrders.length||!bizRefs.salesOutbounds.length)await bizLoadRefs();
var order=(bizRefs.salesOrders||[]).find(function(x){return bizStr(x.Id)===bizStr(orderId)});
if(!order){tip('销售订单不存在');return}
if(order.Status==='草稿'){tip('草稿订单请先确认后再转出库');return}
if(order.Status==='已取消'){tip('已取消的订单不能转出库');return}
if(order.Status!=='已确认'){tip('只有已确认的销售订单才能转出库');return}
var remaining=bizSalesOrderRemaining(order);
if(remaining<=0){tip('该订单已无可出库数量');return}
if(!can('sales_outbound.view')){tip('无权限访问销售出库');return}
if(!can('sales_outbound.add')){tip('无权限新增销售出库');return}
bizGoNextPage('sales-outbound',{search:order.Code||'',openAdd:true,prefill:{SalesOrderId:order.Id,Status:'草稿',Quantity:remaining}});
};
window.bizTransferPurchaseOrderToInbound=async function(poId){
if(!can('purchase_order.view')){tip('无权限操作');return}
if(!bizRefs.purchaseOrders.length||!bizRefs.purchaseInbounds.length)await bizLoadRefs();
var po=(bizRefs.purchaseOrders||[]).find(function(x){return bizStr(x.Id)===bizStr(poId)});
if(!po){tip('采购单不存在');return}
if(po.Status==='草稿'){tip('草稿采购单请先确认后再转入库');return}
if(po.Status==='已取消'){tip('已取消的采购单不能转入库');return}
if(po.Status!=='已确认'){tip('只有已确认的采购单才能转入库');return}
var remaining=bizPurchaseOrderRemaining(po);
if(remaining<=0){tip('该采购单已无可入库数量');return}
if(!can('purchase_inbound.view')){tip('无权限访问采购入库');return}
if(!can('purchase_inbound.add')){tip('无权限新增采购入库');return}
bizGoNextPage('purchase-inbound',{search:po.Code||'',openAdd:true,prefill:{PurchaseOrderId:po.Id,Status:'草稿',Quantity:remaining}});
};
window.bizNextRegisterReceipt=function(id){if(!can('receivable.view')){tip('无权限操作');return}openArapDetailModal('receipt',id);setTimeout(function(){if(arapDetailCan('receipt','add'))openArapDetailEdit(null);},280);};
window.bizNextRegisterPayment=function(id){if(!can('payable.view')){tip('无权限操作');return}openArapDetailModal('payment',id);setTimeout(function(){if(arapDetailCan('payment','add'))openArapDetailEdit(null);},280);};
function bizApplyNextNavForBizPage(page,cfg){
var nav=bizConsumeNextNav(page);if(!nav||!cfg)return;
var p=cfg.prefix;
if(nav.search){var se=document.getElementById(p+'Search');if(se){se.value=nav.search;bizRender(cfg);}}
if(nav.openAdd&&bizCan(cfg,'add')){
setTimeout(function(){
openBizModal(cfg,nav.prefill||null);
setTimeout(function(){
if(nav.prefill&&nav.prefill.SalesOrderId&&cfg.view==='salesOutboundView'){
var f=cfg.fields.find(function(x){return x.key==='SalesOrderId'});
if(f){
bizSetFieldVal(cfg,'SalesOrderId',nav.prefill.SalesOrderId);
bizApplyRefFill(cfg,f);
var rem=numVal(bizGetFieldVal(cfg,'RemainingQuantity'));
var defQty=nav.prefill.Quantity!=null?numVal(nav.prefill.Quantity):(rem>0?rem:0);
if(defQty>0)bizSetFieldVal(cfg,'Quantity',bizMoney2(defQty));
bizUpdateStockHint(cfg);
}
}
if(nav.prefill&&nav.prefill.PurchaseOrderId&&cfg.view==='purchaseInboundView'){
var f2=cfg.fields.find(function(x){return x.key==='PurchaseOrderId'});
if(f2){
bizSetFieldVal(cfg,'PurchaseOrderId',nav.prefill.PurchaseOrderId);
bizApplyRefFill(cfg,f2);
var remIn=numVal(bizGetFieldVal(cfg,'RemainingQuantity'));
var defIn=nav.prefill.Quantity!=null?numVal(nav.prefill.Quantity):(remIn>0?remIn:0);
if(defIn>0)bizSetFieldVal(cfg,'Quantity',bizMoney2(defIn));
bizRecalcForm(cfg);
}
}
if(nav.prefill&&nav.prefill.BomId&&cfg.view==='productionPickView'){
var f3=cfg.fields.find(function(x){return x.key==='BomId'});if(f3)bizApplyRefFill(cfg,f3);
}
if(nav.prefill&&(nav.prefill.ModelCostId||nav.prefill.BomId)&&cfg.view==='finishedInboundView'){
var f4=cfg.fields.find(function(x){return x.key==='ModelCostId'});
if(f4&&nav.prefill.ModelCostId){document.getElementById(bizId(cfg,'ModelCostId')).value=nav.prefill.ModelCostId;bizApplyRefFill(cfg,f4);}
else{var f5=cfg.fields.find(function(x){return x.key==='BomId'});if(f5&&nav.prefill.BomId){document.getElementById(bizId(cfg,'BomId')).value=nav.prefill.BomId;bizApplyRefFill(cfg,f5);}}
if(nav.prefill.Quantity){bizSetFieldVal(cfg,'Quantity',nav.prefill.Quantity);bizRecalcForm(cfg);}
}
},120);
},220);
}
}
function bizApplyNextNavPwo(){
var nav=bizConsumeNextNav('production-work-order');if(!nav)return;
if(nav.search){var se=document.getElementById('pwoSearch');if(se){se.value=nav.search;pwoRender();}}
if(nav.openAdd&&pwoCan('add')){
setTimeout(function(){
var open=function(){
pwoOpenAdd();
if(nav.prefill&&nav.prefill.SourceType==='销售订单'&&nav.prefill.SalesOrderId){
setTimeout(function(){
document.getElementById('pwoSourceType').value='销售订单';
pwoRefreshSourceVisibility();
document.getElementById('pwoSalesOrderId').value=nav.prefill.SalesOrderId;
pwoApplySalesOrderFill(nav.prefill.SalesOrderId);
},180);
}
};
if(!bizRefs.customers.length||!bizRefs.salesOrders.length)bizLoadRefs().then(open);else open();
},220);
}
}
function wireBizPageNextToolbar(cfg,page){
var p=cfg.prefix;
if(page==='production-pick'){
var nb=document.getElementById(p+'NextFin');if(nb&&!nb._bizWired){nb._bizWired=1;nb.onclick=function(){if(!can('finished_inbound.view')){tip('无权限访问成品入库');return}bizGoNextPage('finished-inbound',{search:''});};}
}
if(page==='finished-inbound'){
var nb2=document.getElementById(p+'NextOut');if(nb2&&!nb2._bizWired){nb2._bizWired=1;nb2.onclick=function(){if(!can('sales_outbound.view')){tip('无权限访问销售出库');return}bizGoNextPage('sales-outbound',{search:''});};}
}
}
function bizBuildDeleteConfirm(cfg,item){
var lines=[];
if(BIZ_DELETE_LINK_VIEWS.indexOf(cfg.view)>=0&&item&&item.Status==='已确认')lines.push('删除已确认单据可能影响库存、应收或应付数据。确定继续删除吗？');

function bizPayStatus(pay,paid){paid=numVal(paid);pay=numVal(pay);if(paid<=0)return'未付款';if(paid>=pay)return'已付清';return'部分付款'}
function bizStr(v){return v===undefined||v===null?'':String(v).trim();}
function bizIsTextField(f){
if(!f)return false;
if(f.type==='refSelect'||f.type==='select'||f.type==='date')return true;
var k=f.key||'';
if(/Code$|Name$|Contact$|Phone$|Address$|No$|Note$|Status$|Date$|Id$/i.test(k))return true;
return false;
}
function bizIsMoneyField(f){
if(f.money)return true;
if(bizIsTextField(f))return false;
var k=f.key||'',l=f.label||'';
if(/Quantity|Qty|数量/i.test(k)||/数量/.test(l))return false;
if(/(?:^|[A-Z])(Amount|Price|Cost)(?:$|[A-Z])|金额|单价|成本/.test(k)||/金额|单价|成本/.test(l))return true;
return false;
}
function bizFindCustomer(cid,code,name){
var list=bizRefs.customers||[];
cid=bizStr(cid);code=bizStr(code);name=bizStr(name);
if(code&&code.indexOf(' ')>0){var p=code.split(/\s+/);code=p[0];if(!name)name=p.slice(1).join(' ');}
if(name&&name.indexOf(' ')>0&&!code){var q=name.split(/\s+/);if(q[0]){code=q[0];name=q.slice(1).join(' ');}}
return list.find(function(x){return bizStr(x.Id)===cid})||list.find(function(x){return bizStr(x.Code).toLowerCase()===code.toLowerCase()})||list.find(function(x){return bizStr(x.Company).toLowerCase()===name.toLowerCase()})||null;
}

if(cust){
row.CustomerId=bizStr(cust.Id);
row.CustomerCode=bizStr(cust.Code);
row.CustomerName=bizStr(cust.Company);
row.CustomerContact=bizStr(cust.Contact);
row.CustomerPhone=bizStr(cust.Phone);
row.CustomerAddress=bizStr(cust.Address);
}else{
row.CustomerId=bizStr(row.CustomerId);
row.CustomerCode=bizStr(row.CustomerCode);
row.CustomerName=bizStr(row.CustomerName);
row.CustomerContact=bizStr(row.CustomerContact);
row.CustomerPhone=bizStr(row.CustomerPhone);
row.CustomerAddress=bizStr(row.CustomerAddress);
}
if(row.MaterialId!=null)row.MaterialId=bizStr(row.MaterialId);

if(row.MaterialName!=null)row.MaterialName=bizStr(row.MaterialName);

}
function bizIsLongNameField(f){if(!f)return false;var k=f.key||'',l=f.label||'';return /Name|Company|Supplier|Material|Product|Note|Address|Goods|Spec|Bom|Party/i.test(k)||/名称|供应商|客户|物料|产品|备注|地址|规格|BOM|甲方/.test(l)}
function bizFormatCell(f,v,forList){
if(v===undefined||v===null||v==='')return'-';
if(f.type==='date'||/Date$/i.test(f.key)||f.key==='UpdatedAt')return formatDateTime(v);
var out;
if(f.key==='ItemType')out=v==='FinishedProduct'?'成品':(v==='Material'?'物料':String(v));
else if(f.key==='PriceType')out=v==='含税'||v==='不含税'?String(v):String(v);
else if(f.type==='select'&&f.optionLabels&&f.options){var i=f.options.indexOf(v);out=(i>=0&&f.optionLabels[i])?f.optionLabels[i]:String(v)}
else if(f.type==='number'||f.readonly||(typeof v==='number'))out=bizIsMoneyField(f)?money(v):String(bizMoney2(v));
else out=String(v);
if(forList&&bizIsLongNameField(f)&&out!=='-')return cellEllipsis(out,/Material|Product|Bom|Goods|Spec|Name|Company|Supplier/.test(f.key||'')?'col-goods':'col-company');
return safe(out);
}
function bizFormatCellTd(f,v,forList){
var cls=bizCellClass(f,forList);
var inner=bizFormatCell(f,v,forList);
if(inner==='-')return '<td'+(cls?' class="'+cls+'"':'')+'>'+inner+'</td>';
if(cls==='col-money'||cls==='col-qty')return '<td class="'+cls+'">'+inner+'</td>';
if(cls==='col-status')return '<td class="'+cls+'"><span class="status">● '+inner+'</span></td>';
return '<td'+(cls?' class="'+cls+'"':'')+'>'+inner+'</td>';
}
function bizStockTypeLabel(t,item){
if(item&&item.StockType)return safe(item.StockType);
t=bizStr(t);
if(t==='FinishedProduct'||t==='成品')return'成品设备';
if(t==='半成品')return'半成品';
if(t==='Material'||t==='物料')return'外购配件';
return t||'外购配件';
}
function bizStockStatusClass(st){st=bizStr(st);if(st==='缺货')return'stock-status-out';if(st==='偏低')return'stock-status-low';return'stock-status-ok'}
function bizUpdatePurchaseInboundTypeHint(cfg,st,mat){

function bizMaterialUnitPrice(mat){

return numVal(mat.TaxPrice)>0?numVal(mat.TaxPrice):numVal(mat.NoTaxPrice);
}
function bizMaterialPriceType(mat){

function bizFindSupplier(sid,code,name){

}
function bizSumConfirmedOutbound(orderId,excludeId){
return (bizRefs.salesOutbounds||[]).filter(function(x){return bizStr(x.SalesOrderId)===bizStr(orderId)&&x.Status==='已确认'&&bizStr(x.Id)!==bizStr(excludeId);}).reduce(function(s,x){return s+numVal(x.Quantity)},0);

function bizSumConfirmedInbound(poId,excludeId){
return (bizRefs.purchaseInbounds||[]).filter(function(x){return bizStr(x.PurchaseOrderId)===bizStr(poId)&&x.Status==='已确认'&&bizStr(x.Id)!==bizStr(excludeId);}).reduce(function(s,x){return s+numVal(x.Quantity)},0);

function bizSetFieldVal(cfg,key,val){var el=document.getElementById(bizId(cfg,key));if(!el)return;el.value=val===undefined||val===null?'':val;}
function bizGetFieldVal(cfg,key){var el=document.getElementById(bizId(cfg,key));return el?el.value:'';}
function bizFieldVisible(cfg,f){
if(!f||!f.showWhen)return true;
var cur=bizGetFieldVal(cfg,f.showWhen.key);
if(Array.isArray(f.showWhen.value))return f.showWhen.value.indexOf(cur)>=0;
return cur===f.showWhen.value;
}
function bizRefreshFieldVisibility(cfg){
cfg.fields.forEach(function(f){
var wrap=document.getElementById(bizId(cfg,f.key)+'_wrap');
if(!wrap)return;
wrap.classList.toggle('biz-field-hidden',!bizFieldVisible(cfg,f));
});
var costPanel=document.getElementById(cfg.prefix+'CostPanel');
var costToggle=document.getElementById(cfg.prefix+'CostToggle');
var costCollapse=costToggle?costToggle.closest('.biz-cost-collapse'):null;
var hasCost=cfg.fields.some(function(f){return f.costHidden&&bizFieldVisible(cfg,f);});
if(costCollapse)costCollapse.style.display=hasCost?'':'none';
if(costPanel){if(!hasCost){costPanel.classList.remove('open');costPanel.style.display='none';}else costPanel.style.display='';}
}
function bizApplyMaterialPriceFill(cfg,mat){
if(!mat)return;
bizSetFieldVal(cfg,'MaterialUnit',bizMaterialUnitFromQtyUnit(mat.QuantityUnit));
if(cfg.view==='purchaseOrderView'){
var up=bizMaterialUnitPrice(mat);if(up>0)bizSetFieldVal(cfg,'UnitPrice',bizMoney2(up));
bizSetFieldVal(cfg,'PriceType',bizMaterialPriceType(mat));
}else if(cfg.view==='purchaseInboundView'){
var up2=bizMaterialUnitPrice(mat);if(up2>0)bizSetFieldVal(cfg,'InboundPrice',bizMoney2(up2));
bizSetFieldVal(cfg,'MaterialUnit',bizMaterialUnitFromQtyUnit(mat.QuantityUnit));
}else if(cfg.view==='salesOrderView'){
var pt=bizMaterialPriceType(mat),up=bizMaterialUnitPrice(mat);
if(up>0){if(pt==='含税')bizSetFieldVal(cfg,'TaxIncludedSalePrice',bizMoney2(up));else bizSetFieldVal(cfg,'TaxExcludedSalePrice',bizMoney2(up));}
}else if(cfg.view==='productionPickView'){
var cp=bizMaterialUnitPrice(mat);if(cp>0)bizSetFieldVal(cfg,'CostPrice',bizMoney2(cp));
}

}
function bizApplySupplierUiFields(cfg,sid){

bizSetFieldVal(cfg,'SupplierContact',bizStr(sup.Contact));
bizSetFieldVal(cfg,'SupplierPhone',bizStr(sup.Phone));

function bizApplySalesOrderDisplay(cfg,order,excludeId){
if(!order)return;
var shipped=bizSumConfirmedOutbound(order.Id,excludeId),remaining=bizMoney2(numVal(order.Quantity)-shipped);
bizSetFieldVal(cfg,'OrderQuantity',bizMoney2(order.Quantity));
bizSetFieldVal(cfg,'ShippedQuantity',bizMoney2(shipped));
bizSetFieldVal(cfg,'RemainingQuantity',bizMoney2(Math.max(0,remaining)));
var salePrice=numVal(order.TaxIncludedSalePrice)>0?order.TaxIncludedSalePrice:(numVal(order.TaxExcludedSalePrice)>0?order.TaxExcludedSalePrice:order.UnitPrice);
var saleAmt=numVal(order.TaxIncludedSaleAmount)>0?order.TaxIncludedSaleAmount:(numVal(order.TaxExcludedSaleAmount)>0?order.TaxExcludedSaleAmount:order.Amount);
bizSetFieldVal(cfg,'DisplaySalePrice',money(salePrice));
bizSetFieldVal(cfg,'DisplaySaleAmount',money(saleAmt));
if(order.ItemType==='FinishedProduct'||order.ModelCostId){
var mc=(bizRefs.modelCosts||[]).find(function(x){return bizStr(x.Id)===bizStr(order.ModelCostId)});
if(mc){var c=numVal(mc.TotalCost)>0?mc.TotalCost:mc.MaterialCost;if(c>0)bizSetFieldVal(cfg,'CostPrice',bizMoney2(c));}
}else if(order.MaterialId){
var mat=(bizRefs.materials||[]).find(function(x){return bizStr(x.Id)===bizStr(order.MaterialId)});
if(mat){var p=bizMaterialUnitPrice(mat);if(p>0)bizSetFieldVal(cfg,'CostPrice',bizMoney2(p));bizApplyMaterialStockTypeFill(cfg,mat);}
}
if(cfg.view==='salesOutboundView'){
if(order.ItemType==='FinishedProduct'||order.ModelCostId)bizSetFieldVal(cfg,'MaterialStockType','成品设备');
}
}
function bizApplyPurchaseOrderDisplay(cfg,po,excludeId){
if(!po)return;
var received=bizSumConfirmedInbound(po.Id,excludeId),remaining=bizMoney2(numVal(po.Quantity)-received);
bizSetFieldVal(cfg,'OrderQuantity',bizMoney2(po.Quantity));
bizSetFieldVal(cfg,'ReceivedQuantity',bizMoney2(received));
bizSetFieldVal(cfg,'RemainingQuantity',bizMoney2(Math.max(0,remaining)));
bizSetFieldVal(cfg,'DisplayPriceType',bizStr(po.PriceType)||'不含税');
bizSetFieldVal(cfg,'DisplayOrderAmount',money(po.Amount));
bizSetFieldVal(cfg,'InboundPrice',bizMoney2(po.UnitPrice));
var matPo=(bizRefs.materials||[]).find(function(x){return bizStr(x.Id)===bizStr(po.MaterialId)});
if(matPo&&cfg.view==='purchaseInboundView')bizApplyMaterialStockTypeFill(cfg,matPo);
}
function bizApplyModelCostFill(cfg,mc){
if(!mc)return;
if(cfg.view==='finishedInboundView'){
var c=numVal(mc.TotalCost)>0?mc.TotalCost:mc.MaterialCost;if(c>0)bizSetFieldVal(cfg,'UnitCost',bizMoney2(c));
bizSetFieldVal(cfg,'MaterialStockType','成品设备');
}else if(cfg.view==='salesOrderView'&&cfg.view!=='salesOutboundView'){}
}
function bizApplyBomFill(cfg,bom){
if(!bom||cfg.view!=='finishedInboundView')return;
if(numVal(bizGetFieldVal(cfg,'UnitCost'))<=0&&numVal(bom.TotalMaterialCost)>0)bizSetFieldVal(cfg,'UnitCost',bizMoney2(bom.TotalMaterialCost));
}
function bizUpdateStockHint(cfg){
var hint=document.getElementById(cfg.prefix+'StockHint');if(!hint)return;
var qty=numVal(bizGetFieldVal(cfg,'Quantity')),avail=0,label='';
if(cfg.view==='salesOutboundView'){
var orderId=bizGetFieldVal(cfg,'SalesOrderId'),order=(bizRefs.salesOrders||[]).find(function(x){return bizStr(x.Id)===orderId});
if(!order){hint.textContent='请先选择来源销售订单';hint.className='biz-stock-hint';return;}
var st=bizEnsureState(cfg.view),exclude=st.editing||'';
bizApplySalesOrderDisplay(cfg,order,exclude);
var remaining=numVal(bizGetFieldVal(cfg,'RemainingQuantity'));
if(qty>remaining+0.0001){hint.textContent='本次出库数量不能超过未出库数量 '+bizMoney2(remaining);hint.className='biz-stock-hint warn';return;}
if(order.ItemType==='FinishedProduct'||order.ModelCostId){
var si=(bizRefs.stockItems||[]).find(function(x){return bizStr(x.ItemId)===bizStr(order.ModelCostId)||bizStr(x.ItemId)===bizStr(order.BomId);});
avail=si?numVal(si.CurrentQuantity!=null?si.CurrentQuantity:si.Quantity):0;label='成品';
}else{
var si2=(bizRefs.stockItems||[]).find(function(x){return bizStr(x.ItemId)===bizStr(order.MaterialId);});
avail=si2?numVal(si2.CurrentQuantity!=null?si2.CurrentQuantity:si2.Quantity):0;label='物料';
}
}else if(cfg.view==='productionPickView'){
var mid=bizGetFieldVal(cfg,'MaterialId');
var si3=(bizRefs.stockItems||[]).find(function(x){return bizStr(x.ItemId)===mid;});
avail=si3?numVal(si3.CurrentQuantity!=null?si3.CurrentQuantity:si3.Quantity):0;label='物料';
}else{hint.textContent='';hint.className='biz-stock-hint';return;}
if(qty>0&&qty>avail+0.0001){
var stType=bizGetFieldVal(cfg,'MaterialStockType')||label;
hint.textContent='库存类型 '+stType+'，当前库存 '+bizQty(avail)+bizStockHintSafetyText(si3||si2||si)+'，本次 '+bizQty(qty)+'，库存可能不足（仍允许保存，请确认）';
hint.className='biz-stock-hint warn';
}else{
var stType2=bizGetFieldVal(cfg,'MaterialStockType')||label;
var siRef=si3||si2||si;
hint.textContent='库存类型 '+stType2+'，当前库存 '+bizQty(avail)+bizStockHintSafetyText(siRef)+'，本次 '+bizQty(qty);
hint.className='biz-stock-hint';
}
}
function bizQty(v){return String(bizMoney2(v))}
function bizRefLabel(refKey,item,display){
if(!item)return'';
if(refKey==='materials'){var mp=bizMaterialUnitPrice(item),st=item.StockType||'外购配件';return safe((item.Code||'')+' '+ (item.NameSpec||'')+' · '+st+(mp>0?(' · '+money(mp)):''));}
if(refKey==='customers')return safe((item.Code||'')+' '+ (item.Company||''));
if(refKey==='suppliers')return safe((item.Code||'')+' '+ (item.Company||''));
if(refKey==='salesOrders')return safe((item.Code||'')+' / '+(item.CustomerCode||'')+' / '+(item.CustomerName||''));
if(refKey==='purchaseOrders'){
var rem=bizPurchaseOrderRemaining(item);
return safe((item.Code||'')+' / '+(item.SupplierName||'')+' / '+(item.MaterialName||'')+(rem>0?(' · 未入库 '+bizQty(rem)):''));
}
if(refKey==='workOrders')return safe((item.WorkOrderNo||'')+' / '+(item.ProductName||'')+' / 计划 '+bizQty(item.Quantity));
if(refKey==='pickMaterials'){var mp=bizMaterialUnitPrice(item),inBom=(bizRefs.pickMaterials||[]).some(function(x){return bizStr(x.Id)===bizStr(item.Id)});return safe((item.Code||'')+' '+ (item.NameSpec||'')+(mp>0?(' · '+money(mp)):'')+(inBom?'':' · 非BOM物料'));}
if(refKey==='boms')return safe((item.Code||'')+' '+ (item.ModelName||item.ProductName||''));
if(refKey==='modelCosts')return safe((item.ModelCode||'')+' '+ (item.ModelName||item.ProductName||''));
return safe(item[display||'Code']||item.Code||item.Id||'');
}
async function bizLoadRefs(){
try{
if(can('sales_order.view'))bizRefs.salesOrders=await api('/api/sales-orders')||[];
if(can('purchase_order.view'))bizRefs.purchaseOrders=await api('/api/purchase-orders')||[];
if(can('sales_outbound.view'))bizRefs.salesOutbounds=await api('/api/sales-outbounds')||[];
if(can('purchase_inbound.view'))bizRefs.purchaseInbounds=await api('/api/purchase-inbounds')||[];
if(can('material.view')||can('bom.view'))bizRefs.materials=await api('/api/materials')||[];
if(can('bom.view')||can('model_cost.view'))bizRefs.boms=await api('/api/bom')||[];
if(can('model_cost.view'))bizRefs.modelCosts=await api('/api/model-costs')||[];
if(can('customer.view'))bizRefs.customers=await api('/api/customers')||[];
if(can('supplier.view'))bizRefs.suppliers=await api('/api/suppliers')||[];
if(can('stock.view'))bizRefs.stockItems=await api('/api/stocks')||[];
if(can('production_pick.view')){try{bizRefs.workOrders=await api('/api/production-work-orders')||[]}catch(e){bizRefs.workOrders=[]}}
bizRefs.pickMaterials=bizRefs.materials.slice();
}catch(e){}
}
function bizFillRefSelect(cfg,f,item){
var el=document.getElementById(bizId(cfg,f.key));if(!el||f.type!=='refSelect')return;
var list=f.ref==='pickMaterials'?(bizRefs.pickMaterials||bizRefs.materials||[]):(bizRefs[f.ref]||[]),opts=f.req?'<option value="">请选择</option>':'<option value="">（不关联）</option>';
list.forEach(function(it){
var sel=(item&&bizStr(item[f.key])===bizStr(it.Id))?' selected':'';
if(!sel&&item&&f.ref==='customers'&&(item.CustomerCode||item.CustomerName)){
if(item.CustomerCode&&bizStr(item.CustomerCode)===bizStr(it.Code))sel=' selected';
else if(item.CustomerName&&bizStr(item.CustomerName).toLowerCase()===bizStr(it.Company).toLowerCase())sel=' selected';
}
opts+='<option value="'+safe(it.Id)+'"'+sel+'>'+bizRefLabel(f.ref,it,f.display)+'</option>';
});
el.innerHTML=opts;
if(item&&bizStr(item[f.key]))el.value=bizStr(item[f.key]);
else if(f.ref==='customers'&&item){
var mc=bizFindCustomer('',item.CustomerCode,item.CustomerName);
if(mc)el.value=mc.Id;
}else if(f.ref==='suppliers'&&item){
var ms=bizFindSupplier('',item.SupplierCode,item.SupplierName);
if(ms)el.value=ms.Id;
}else el.value='';
}
function bizMaterialUnitFromQtyUnit(qu){var s=bizStr(qu);if(!s)return'';var m=s.match(/^\d+(?:\.\d+)?\s*(.+)$/);return m&&m[1]?m[1].trim():s}
function bizApplyRefFill(cfg,f){
var el=document.getElementById(bizId(cfg,f.key));if(!el||(!f.fill&&!f.ref))return;
var it=(bizRefs[f.ref]||[]).find(function(x){return bizStr(x.Id)===bizStr(el.value)});
if(f.fill&&it){
Object.keys(f.fill).forEach(function(tk){
var tel=document.getElementById(bizId(cfg,tk));if(!tel)return;
var val=bizStr(it[f.fill[tk]]);
if(tel.tagName==='SELECT')tel.value=val;else tel.value=val;
});
}
if(f.ref==='materials'&&it)bizApplyMaterialPriceFill(cfg,it);
if(f.ref==='suppliers'&&it){if(cfg.view==='purchaseInboundView')bizApplyInboundSupplierFields(cfg,it.Id);else bizApplySupplierUiFields(cfg,it.Id);}
if(f.ref==='modelCosts'&&it)bizApplyModelCostFill(cfg,it);
if(f.ref==='boms'&&it){bizApplyBomFill(cfg,it);if(cfg.view==='productionPickView'){bizRefreshPickMaterialList(cfg);var mf=cfg.fields.find(function(x){return x.key==='MaterialId'});if(mf)bizFillRefSelect(cfg,mf,null);}}
if(f.ref==='workOrders'&&it)bizApplyWorkOrderFill(cfg,it);
if(f.ref==='salesOrders'&&it){
var st=bizEnsureState(cfg.view);
bizApplySalesOrderDisplay(cfg,it,st.editing||'');
var qEl=document.getElementById(bizId(cfg,'Quantity'));
if(qEl&&numVal(qEl.value)<=0){var rem=numVal(bizGetFieldVal(cfg,'RemainingQuantity'));qEl.value=bizMoney2(rem>0?rem:numVal(it.Quantity));}
}
if(f.ref==='purchaseOrders'&&it){var st2=bizEnsureState(cfg.view);bizApplyPurchaseOrderDisplay(cfg,it,st2.editing||'');}
if(cfg.view==='purchaseInboundView'&&f.key==='MaterialId')bizApplyInboundManualMaterial(cfg);
if(cfg.view==='receivableView'||cfg.view==='payableView')bizToggleArapLinkedReadonly(cfg);
bizRecalcForm(cfg);bizRefreshFieldVisibility(cfg);bizUpdateStockHint(cfg);
if(cfg.view==='finishedInboundView')bizUpdateFinishedInboundHint(cfg);
}
function bizEnsureState(view){var st=bizState[view];if(!st){st=bizState[view]={data:[],editing:null,selected:new Set()};return st}if(!st.selected)st.selected=new Set();if(!st.data)st.data=[];return st;}
function bizBatchWritableFields(cfg){return cfg.fields.filter(function(f){if(f.computed)return false;if(f.type==='refSelect'&&f.batchRef)return true;if(f.type==='refSelect')return false;if(f.readonly)return false;return true;});}
function bizBatchRefSelectHtml(cfg,f){

['asoClose','asoModalCancel'].forEach(function(id){var el=document.getElementById(id);if(el&&!el._asoWired){el._asoWired=1;el.onclick=function(){if(window.erpUiLock&&!window.erpUiLock.guardClose())return;closeAsoModal()}}});
['asoDetailClose','asoDetailOk'].forEach(function(id){var el=document.getElementById(id);if(el&&!el._asoWired){el._asoWired=1;el.onclick=closeAsoDetail}});
var cust=document.getElementById('asoCustomerId');if(cust&&!cust._asoWired){cust._asoWired=1;cust.onchange=function(){asoApplyCustomerFill(cust.value)}}
var addPart=document.getElementById('asoAddPart');if(addPart&&!addPart._asoWired){addPart._asoWired=1;addPart.onclick=function(){asoAddPartLine()}}
['asoLaborAmount','asoOtherAmount','asoDiscountAmount','asoReceivedAmount'].forEach(function(id){var el=document.getElementById(id);if(el&&!el._asoWired){el._asoWired=1;el.oninput=function(){asoRecalcSummaryFromForm()}}});
}

if(document.getElementById('afterSalesServiceOrderView'))initAfterSalesServiceOrderUi();
var _origInitBusinessUiAs=initBusinessUi;
initBusinessUi=function(){_origInitBusinessUiAs();initAfterSalesServiceOrderUi()};
window.loadAfterSalesServiceOrderPage=loadAfterSalesServiceOrderPage;
window.asoOpenAdd=asoOpenAdd;
window.asoBuildListNextActions=asoBuildListNextActions;
window.asoConfirmDispatch=asoConfirmDispatch;window.asoStart=asoStart;window.asoFinish=asoFinish;window.asoSettle=asoSettle;window.asoCancelOrder=asoCancelOrder;
})();
