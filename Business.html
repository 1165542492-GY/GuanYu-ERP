function bizHasEditConflictView(v){return v==='salesOrderView'||v==='salesOutboundView'||v==='purchaseOrderView'||v==='purchaseInboundView'||v==='productionPickView'||v==='finishedInboundView'||v==='receivableView'||v==='payableView';}
function bizId(cfg,k){return cfg.prefix+'_'+k}
function bizToday(){var d=new Date(),p=function(n){return n<10?'0'+n:''+n};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function bizMoney2(v){return Math.round(numVal(v)*100)/100}
function bizRecStatus(rec,recv){recv=numVal(recv);rec=numVal(rec);if(recv<=0)return'未收款';if(recv>=rec)return'已收清';return'部分收款'}
function bizPayStatus(pay,paid){paid=numVal(paid);pay=numVal(pay);if(paid<=0)return'未付款';if(paid>=pay)return'已付清';return'部分付款'}
function bizStr(v){return v===undefined||v===null?'':String(v).trim();}
function bizIsTextField(f){
if(!f)return false;
if(f.type==='refSelect'||f.type==='select'||f.type==='date')return true;
var k=f.key||'';
if(/Code$|Name$|Contact$|Phone$|Address$|No$|Note$|Status$|Date$|Id$/i.test(k))return true;
return false;
}
function bizIsMoneyField(f){
if(f.money)return true;
if(bizIsTextField(f))return false;
var k=f.key||'',l=f.label||'';
if(/Quantity|Qty|数量/i.test(k)||/数量/.test(l))return false;
if(/(?:^|[A-Z])(Amount|Price|Cost)(?:$|[A-Z])|金额|单价|成本/.test(k)||/金额|单价|成本/.test(l))return true;
return false;
}
function bizFindCustomer(cid,code,name){
var list=bizRefs.customers||[];
cid=bizStr(cid);code=bizStr(code);name=bizStr(name);
if(code&&code.indexOf(' ')>0){var p=code.split(/\s+/);code=p[0];if(!name)name=p.slice(1).join(' ');}
if(name&&name.indexOf(' ')>0&&!code){var q=name.split(/\s+/);if(q[0]){code=q[0];name=q.slice(1).join(' ');}}
return list.find(function(x){return bizStr(x.Id)===cid})||list.find(function(x){return bizStr(x.Code).toLowerCase()===code.toLowerCase()})||list.find(function(x){return bizStr(x.Company).toLowerCase()===name.toLowerCase()})||null;
}
function bizApplySalesOrderCustomerFields(row){
var cust=bizFindCustomer(row.CustomerId,row.CustomerCode,row.CustomerName);
if(cust){
row.CustomerId=bizStr(cust.Id);
row.CustomerCode=bizStr(cust.Code);
row.CustomerName=bizStr(cust.Company);
row.CustomerContact=bizStr(cust.Contact);
row.CustomerPhone=bizStr(cust.Phone);
row.CustomerAddress=bizStr(cust.Address);
}else{
row.CustomerId=bizStr(row.CustomerId);
row.CustomerCode=bizStr(row.CustomerCode);
row.CustomerName=bizStr(row.CustomerName);
row.CustomerContact=bizStr(row.CustomerContact);
row.CustomerPhone=bizStr(row.CustomerPhone);
row.CustomerAddress=bizStr(row.CustomerAddress);
}
if(row.MaterialId!=null)row.MaterialId=bizStr(row.MaterialId);
if(row.MaterialCode!=null)row.MaterialCode=bizStr(row.MaterialCode);
if(row.MaterialName!=null)row.MaterialName=bizStr(row.MaterialName);
return row;
}
function bizFormatCell(f,v){
if(v===undefined||v===null||v==='')return'-';
if(f.type==='number'||f.readonly||(typeof v==='number'))return bizIsMoneyField(f)?money(v):String(bizMoney2(v));
return safe(v);
}
function bizQty(v){return String(bizMoney2(v))}
function bizRefLabel(refKey,item,display){
if(!item)return'';
if(refKey==='materials'){var mp=typeof materialDisplayUnitPrice==='function'?materialDisplayUnitPrice(item):'';return safe((item.Code||'')+' '+ (item.NameSpec||'')+(mp?(' · '+money(mp)):''));}
if(refKey==='customers')return safe((item.Code||'')+' '+ (item.Company||''));
if(refKey==='salesOrders')return safe((item.Code||'')+' / '+(item.CustomerCode||'')+' / '+(item.CustomerName||''));
if(refKey==='boms')return safe((item.Code||'')+' '+ (item.ModelName||item.ProductName||''));
if(refKey==='modelCosts')return safe((item.ModelCode||'')+' '+ (item.ModelName||item.ProductName||''));
return safe(item[display||'Code']||item.Code||item.Id||'');
}
async function bizLoadRefs(){
try{
if(can('sales_order.view'))bizRefs.salesOrders=await api('/api/sales-orders')||[];
if(can('purchase_order.view'))bizRefs.purchaseOrders=await api('/api/purchase-orders')||[];
if(can('material.view')||can('bom.view'))bizRefs.materials=await api('/api/materials')||[];
if(can('bom.view')||can('model_cost.view'))bizRefs.boms=await api('/api/bom')||[];
if(can('model_cost.view'))bizRefs.modelCosts=await api('/api/model-costs')||[];
if(can('customer.view'))bizRefs.customers=await api('/api/customers')||[];
}catch(e){}
}
function bizFillRefSelect(cfg,f,item){
var el=document.getElementById(bizId(cfg,f.key));if(!el||f.type!=='refSelect')return;
var list=bizRefs[f.ref]||[],opts=f.req?'<option value="">请选择</option>':'<option value="">（不关联）</option>';
list.forEach(function(it){
var sel=(item&&bizStr(item[f.key])===bizStr(it.Id))?' selected':'';
if(!sel&&item&&f.ref==='customers'&&(item.CustomerCode||item.CustomerName)){
if(item.CustomerCode&&bizStr(item.CustomerCode)===bizStr(it.Code))sel=' selected';
else if(item.CustomerName&&bizStr(item.CustomerName).toLowerCase()===bizStr(it.Company).toLowerCase())sel=' selected';
}
opts+='<option value="'+safe(it.Id)+'"'+sel+'>'+bizRefLabel(f.ref,it,f.display)+'</option>';
});
el.innerHTML=opts;
if(item&&bizStr(item[f.key]))el.value=bizStr(item[f.key]);
else if(f.ref==='customers'&&item){
var mc=bizFindCustomer('',item.CustomerCode,item.CustomerName);
if(mc)el.value=mc.Id;
}else el.value='';

if(finWrap)finWrap.style.display=isReceipt?'':'none';
document.getElementById('arapDetailDate').value=detail?(detail[arapDetailDateKey(st.type)]||'').slice(0,10):bizToday();
document.getElementById('arapDetailAmount').value=detail?bizMoney2(detail.Amount):'';
document.getElementById('arapDetailAccount').value=detail&&detail.Account?detail.Account:ARAP_ACCOUNTS[0];
if(isReceipt&&document.getElementById('arapDetailFinanceAccount'))document.getElementById('arapDetailFinanceAccount').value='';
document.getElementById('arapDetailMethod').value=detail?(detail.PaymentMethod||''):'';
document.getElementById('arapDetailHandler').value=detail?(detail.Handler||''):'';
document.getElementById('arapDetailNote').value=detail?(detail.Note||''):'';
document.getElementById('arapDetailEditModal').classList.add('show');
}

function closeArapDetailEditModal(){
if(window.erpUiLock&&!window.erpUiLock.guardClose())return;
document.getElementById('arapDetailEditModal').classList.remove('show');
arapDetailState.editingDetailId=null;
}

async function saveArapDetailEdit(){
var st=arapDetailState,cfg=st.cfg,isReceipt=st.type==='receipt';
var amt=numVal(document.getElementById('arapDetailAmount').value);
if(amt<=0){tip(isReceipt?'收款金额必须大于 0':'付款金额必须大于 0');return;}
var body={
UpdatedAt:st.parentUpdatedAt,
Amount:bizMoney2(amt),
Account:document.getElementById('arapDetailAccount').value,
PaymentMethod:document.getElementById('arapDetailMethod').value.trim(),
Handler:document.getElementById('arapDetailHandler').value.trim(),
Note:document.getElementById('arapDetailNote').value.trim()
};
if(isReceipt)body.ReceiptDate=document.getElementById('arapDetailDate').value;else body.PaymentDate=document.getElementById('arapDetailDate').value;
if(isReceipt){var fat=document.getElementById('arapDetailFinanceAccount');if(fat&&fat.value)body.FinanceAccountType=fat.value;}
var base=cfg.api+'/'+st.parentId+'/'+(isReceipt?'receipts':'payments');
var url=st.editingDetailId?base+'/'+st.editingDetailId:base;
var formEl=document.getElementById('arapDetailEditForm');
var impactPayload={receivableId:st.parentId,detailId:st.editingDetailId||''};
var impactOp=st.editingDetailId?'edit':'add';
var doSave=async function(){
await api(url,{method:st.editingDetailId?'PUT':'POST',body:JSON.stringify(body)});
closeArapDetailEditModal();
await refreshArapDetailParent();
tip(st.editingDetailId?'已更新':'已新增');
};
try{
await erpSaveSubmit(formEl,async function(){
if(isReceipt){
if(!(await runWithOperationImpactCheck('receivableReceipt',impactOp,st.editingDetailId||st.parentId,impactPayload,{actionLabel:st.editingDetailId?'保存':'新增',objectLabel:st.item.Code||''},async function(){return true})))return;
}
await doSave();
});
}catch(err){
if(await handleEditConflict(err,function(){closeArapDetailEditModal();closeArapDetailModal();},function(){return refreshArapDetailParent();}))return;
tip(err.message||'保存失败');
}
}

window.openArapDetailEdit=openArapDetailEdit;

async function deleteArapDetail(detailId){
return runActionOnce('arap-detail-del-'+detailId,async function(){
if(!arapDetailCan(arapDetailState.type,'delete')){tip('无权限操作');return;}
if(!await deleteConfirm('确定删除这条明细吗？'))return;
var st=arapDetailState,cfg=st.cfg,isReceipt=st.type==='receipt';
var url=cfg.api+'/'+st.parentId+'/'+(isReceipt?'receipts':'payments')+'/'+detailId;
var doDelete=async function(){
await api(url,{method:'DELETE',body:JSON.stringify({UpdatedAt:st.parentUpdatedAt})});
await refreshArapDetailParent();
tip('已删除');
};
try{
if(isReceipt){
if(!(await runWithOperationImpactCheck('receivableReceipt','delete',detailId,{receivableId:st.parentId,detailId:detailId},{actionLabel:'删除',objectLabel:st.item.Code||''},async function(){return true})))return;
}
await doDelete();
}catch(err){
if(await handleEditConflict(err,closeArapDetailModal,function(){return refreshArapDetailParent();}))return;
tip(err.message||'删除失败');
}
},'删除中...');
}
window.deleteArapDetail=deleteArapDetail;

ensureArapDetailModals();
})();
</script>
