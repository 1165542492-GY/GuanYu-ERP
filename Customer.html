<section class="content" id="customerView" style="display:none">
  <div class="notice"><span>客户编号由系统自动生成。</span></div><div class="notice page-tip-orange"><span>客户被销售订单、应收款或合同引用后，关键资料不能随意修改或删除。</span></div>
  <div class="cards">
    <div class="card"><span class="dot">客</span><div class="card-label">客户总数</div><div class="card-value" id="customerTotal">0</div><div class="card-note">已建档客户</div></div>
    <div class="card"><span class="dot">联</span><div class="card-label">联系人完整</div><div class="card-value" id="customerContacts">0</div><div class="card-note">联系人与电话齐全</div></div>
    <div class="card"><span class="dot">票</span><div class="card-label">开票资料完整</div><div class="card-value" id="customerBilling">0</div><div class="card-note">开户资料已维护</div></div>
    <div class="card"><span class="dot">启</span><div class="card-label">启用客户</div><div class="card-value" id="customerActive">0</div><div class="card-note">当前正常往来客户</div></div>
  </div>
  <div class="panel">
    <div class="tools"><div class="lefttools"><input class="search" id="customerSearch" placeholder="搜索编号、客户、联系人、电话或地址"><button class="btn" id="customerReset">重置</button></div><div><input id="customerImportFile" type="file" accept=".xlsx" style="display:none"><button class="btn" id="customerBatchAddBtn">批量添加</button> <button class="btn danger" id="customerBatchDelBtn">批量删除</button> <button class="btn" id="customerImportBtn">导入表格</button> <button class="btn" id="customerBackup">立即备份</button> <button class="btn" id="customerExport">导出表格</button> <button class="btn primary" id="customerAdd">＋ 新增客户</button></div></div>
    <div class="dual-scroll" id="customerDualScroll"><div class="table-scroll-top" id="customerScrollTop"><div class="table-scroll-inner" id="customerScrollInner"></div></div><div class="tablewrap" id="customerTableWrap"><table class="data-table customer-table" id="customerTable"><thead><tr><th class="col-check"><input type="checkbox" id="customerSelectAll" title="全选/取消全选"></th><th>客户编号</th><th>客户名称</th><th>联系人</th><th>联系电话</th><th>开户行</th><th>银行账号</th><th>开户行行号</th><th>地址</th><th>实时当前应收款</th><th>状态</th><th>最后更新</th><th>操作人</th><th>操作</th></tr></thead><tbody id="customerBody"></tbody></table></div></div>
    <div class="foot"><span id="customerCount">共 0 条记录</span><span>统一数据库 · 自动保存与备份</span></div>
  </div>
</section>

<div class="modal" id="customerModal"><div class="dialog"><div class="dialoghead"><div class="dialogtitle" id="customerModalTitle">新增客户</div><button class="close" id="customerClose">×</button></div><form id="customerForm"><div class="form">
  <div class="formtitle">基本信息</div><div class="grid">
    <div class="field"><label>客户编号</label><input id="customerCode" value="保存后自动生成" readonly></div>
    <div class="field"><label class="req">客户名称</label><input id="customerCompany" required maxlength="100" placeholder="请输入客户公司全称"></div>
    <div class="field"><label>联系人</label><input id="customerContact" placeholder="联系人姓名"></div>
    <div class="field"><label>联系电话</label><input id="customerPhone" placeholder="手机或固定电话"></div>
    <div class="field full"><label>地址</label><input id="customerAddress" placeholder="客户公司或收货地址"></div>
  </div>
  <div class="formtitle">开票资料</div><div class="grid">
    <div class="field full"><label>开户行</label><input id="customerBank" placeholder="银行完整名称及支行"></div>
    <div class="field"><label>银行账号</label><input id="customerAccount" placeholder="请输入银行账号"></div>
    <div class="field"><label>开户行行号</label><input id="customerBankNo" placeholder="请输入联行号"></div>
    <div class="field"><label>实时当前应收款</label><input id="customerReceivable" type="number" step="0.01" value="0"></div>
    <div class="field"><label>状态</label><select id="customerStatus"><option>启用</option><option>停用</option></select></div>
  </div>
</div><div class="dialogfoot"><button type="button" class="btn" id="customerCancel">取消</button><button type="submit" class="btn primary">保存客户</button></div></form></div></div>

<div class="modal" id="customerBatchModal"><div class="dialog batch-dialog"><div class="dialoghead batch-dialog-head"><div class="dialogtitle">批量添加客户</div><div class="batch-dialog-toolbar"><button type="button" class="btn" id="customerBatchAddRow">＋ 继续添加行</button><button type="button" class="btn" id="customerBatchCancel">取消</button><button type="button" class="btn primary" id="customerBatchSave">保存全部</button></div><button class="close" id="customerBatchClose">×</button></div><div class="mini" style="padding:0 23px 10px">一次录入多行资料，编号保存后自动生成。空行会自动忽略。</div><div class="batch-tablewrap"><table class="batch-table"><thead><tr><th>客户名称 *</th><th>联系人</th><th>联系电话</th><th>地址</th><th>开户行</th><th>银行账号</th><th>开户行行号</th><th>当前应收款</th><th>状态</th><th>操作</th></tr></thead><tbody id="customerBatchBody"></tbody></table></div></div></div>

<script>
(function(){var view=document.getElementById('customerView'),anchor=document.getElementById('supplierView');if(view&&anchor&&anchor.parentNode)anchor.parentNode.insertBefore(view,anchor.nextElementSibling);else if(view){var main=document.querySelector('.main');if(main)main.appendChild(view);}if(typeof mountFragmentViews==='function')mountFragmentViews();})();
if(typeof deleteConfirm!=='function'){window.deleteConfirm=async function(msg,opts){if(localStorage.getItem('guanyu-delete-confirm')==='false')return true;return await confirmAction(Object.assign({title:'确认删除',message:msg,confirmText:'确认删除'},opts||{}))};}
var customerData=[],customerEditing=null,customerEditingUpdatedAt=null,customerSelected=new Set();
function onCustomerLoginDone(){if(can('customer.view'))loadCustomerData();else renderCustomers();applyCustomerButtonPermissions();}
function applyCustomerButtonPermissions(){setBtnVisible('customerAdd','customer.add');setBtnVisible('customerBatchAddBtn','customer.add');setBtnVisible('customerBatchDelBtn','customer.batch_delete');setBtnVisible('customerImportBtn','customer.import');setBtnVisible('customerExport','customer.export');var cb=document.getElementById('customerBackup');if(cb)cb.style.display=(typeof isAdminUser==='function'&&isAdminUser())?'':'none';}
function customerVisibleRows(){var q=document.getElementById('customerSearch').value.trim().toLowerCase();return customerData.filter(function(x){return Object.keys(x).map(function(k){return x[k]}).join(' ').toLowerCase().indexOf(q)>=0});}
function updateCustomerSelectAllState(){var rows=customerVisibleRows(),all=rows.length&&rows.every(function(x){return customerSelected.has(x.Id)}),box=document.getElementById('customerSelectAll');if(!box)return;box.checked=!!all;box.indeterminate=rows.some(function(x){return customerSelected.has(x.Id)})&&!all;}
function toggleCustomerSelect(id,checked){if(checked)customerSelected.add(id);else customerSelected.delete(id);updateCustomerSelectAllState();}
function customerBatchRowHtml(){return'<tr><td><input data-f="Company" placeholder="公司全称" maxlength="100"></td><td><input data-f="Contact"></td><td><input data-f="Phone"></td><td><input data-f="Address"></td><td><input data-f="Bank"></td><td><input data-f="Account"></td><td><input data-f="BankNo"></td><td><input data-f="Receivable" type="number" step="0.01" value="0"></td><td><select data-f="Status"><option>启用</option><option>停用</option></select></td><td><button type="button" class="row-del" onclick="this.closest(\'tr\').remove()">删行</button></td></tr>';}
function openCustomerBatchModal(){document.getElementById('customerBatchBody').innerHTML=customerBatchRowHtml()+customerBatchRowHtml()+customerBatchRowHtml();document.getElementById('customerBatchModal').classList.add('show');}
function closeCustomerBatchModal(){if(window.erpUiLock&&!window.erpUiLock.guardClose())return;document.getElementById('customerBatchModal').classList.remove('show');}
function collectCustomerBatchItems(){var items=[],rows=document.getElementById('customerBatchBody').querySelectorAll('tr');rows.forEach(function(tr){var item={},has=false;tr.querySelectorAll('[data-f]').forEach(function(el){var k=el.getAttribute('data-f'),v=el.value.trim();if(k==='Receivable')item.Receivable=Number(el.value||0);else item[k]=v;if(v)has=true;});if(has){if(!item.Company)throw new Error('请填写客户名称');if(!item.Status)item.Status='启用';items.push(item);}});return items;}
async function loadCustomerData(){if(!can('customer.view')){customerData=[];renderCustomers();return}try{customerData=await api('/api/customers');renderCustomers()}catch(e){}}
function renderCustomers(){var rows=customerVisibleRows(),canEdit=can('customer.edit'),canDel=can('customer.delete'),canBatch=can('customer.batch_delete');document.getElementById('customerBody').innerHTML=rows.length?rows.map(function(x){var checked=customerSelected.has(x.Id)?' checked':'';var actions='';if(canEdit)actions+='<button class="action" onclick="editCustomer(\''+x.Id+'\')">编辑</button>';if(canDel)actions+='<button class="action del" onclick="deleteCustomer(\''+x.Id+'\')">删除</button>';if(!actions)actions='-';return'<tr><td class="col-check">'+(canBatch?'<input type="checkbox"'+checked+' onchange="toggleCustomerSelect(\''+x.Id+'\',this.checked)">':'')+'</td><td><b>'+safe(x.Code)+'</b></td><td class="company col-company">'+safe(x.Company)+'</td><td>'+safe(x.Contact||'-')+'</td><td>'+safe(x.Phone||'-')+'</td><td class="col-bank">'+safe(x.Bank||'-')+'</td><td>'+safe(x.Account||'-')+'</td><td>'+safe(x.BankNo||'-')+'</td><td class="col-address">'+safe(x.Address||'-')+'</td><td>'+money(x.Receivable)+'</td><td><span class="status">● '+safe(x.Status||'启用')+'</span></td><td>'+safe(x.UpdatedAt||'-')+'</td><td>'+safe(x.UpdatedBy||'-')+'</td><td>'+actions+'</td></tr>'}).join(''):'<tr><td colspan="14" class="empty">暂无客户，请点击“新增客户”开始建档</td></tr>';document.getElementById('customerCount').textContent='共 '+rows.length+' 条记录';document.getElementById('customerTotal').textContent=customerData.length;document.getElementById('customerContacts').textContent=customerData.filter(function(x){return x.Contact&&x.Phone}).length;document.getElementById('customerBilling').textContent=customerData.filter(function(x){return x.Bank&&x.Account&&x.BankNo}).length;document.getElementById('customerActive').textContent=customerData.filter(function(x){return(x.Status||'启用')==='启用'}).length;updateCustomerSelectAllState();applyCustomerButtonPermissions();if(typeof refreshPageDualScroll==='function'&&typeof _currentPage!=='undefined'&&_currentPage==='customer')refreshPageDualScroll('customer');else if(typeof scheduleDualScrollRefresh==='function')scheduleDualScrollRefresh();if(document.documentElement.dataset.size==='xlarge'&&typeof refreshPageDualScroll==='function')setTimeout(function(){refreshPageDualScroll('customer');},120);}
function openCustomerModal(item){if(item&&!can('customer.edit')){tip('无权限操作');return}if(!item&&!can('customer.add')){tip('无权限操作');return}customerEditing=item?item.Id:null;customerEditingUpdatedAt=item?(item.UpdatedAt||''):null;document.getElementById('customerModalTitle').textContent=item?'编辑客户':'新增客户';document.getElementById('customerCode').value=item?item.Code:'保存后自动生成';['Company','Contact','Phone','Bank','Account','BankNo','Address','Receivable','Status'].forEach(function(f){document.getElementById('customer'+f).value=item?(item[f]===undefined||item[f]===null?'':item[f]):f==='Status'?'启用':f==='Receivable'?'0':''});document.getElementById('customerModal').classList.add('show');setTimeout(function(){document.getElementById('customerCompany').focus()},30)}
function closeCustomerModal(){if(window.erpUiLock&&!window.erpUiLock.guardClose())return;document.getElementById('customerModal').classList.remove('show');document.getElementById('customerForm').reset();customerEditing=null;customerEditingUpdatedAt=null}
function editCustomer(id){openCustomerModal(customerData.find(function(x){return x.Id===id}))}
async function deleteCustomer(id){return runActionOnce('customer-del-'+id,async function(){if(!can('customer.delete')){tip('无权限操作');return}var x=customerData.find(function(v){return v.Id===id});await runWithOperationImpactCheck('customer','delete',id,null,{actionLabel:'删除',objectLabel:(x&&x.Code||'')+' '+(x&&x.Company||'')},async function(){await api('/api/customers/'+id,{method:'DELETE'});await loadCustomerData();tip('客户已删除')})},'删除中...')}
document.getElementById('customerForm').onsubmit=async function(e){e.preventDefault();var body={};['Company','Contact','Phone','Bank','Account','BankNo','Address','Status'].forEach(function(f){body[f]=document.getElementById('customer'+f).value.trim()});body.Receivable=Number(document.getElementById('customerReceivable').value||0);if(!body.Company){tip('请填写客户名称');return}var isEdit=!!customerEditing;if(isEdit)body.UpdatedAt=customerEditingUpdatedAt||'';try{await erpSaveSubmit(this,async function(){await api(isEdit?'/api/customers/'+customerEditing:'/api/customers',{method:isEdit?'PUT':'POST',body:JSON.stringify(body)});closeCustomerModal();await loadCustomerData();tip(isEdit?'客户资料已更新':'客户已新增')})}catch(err){if(await handleEditConflict(err,closeCustomerModal,loadCustomerData))return;tip(err.message||'保存失败')}};
document.getElementById('customerAdd').onclick=function(){openCustomerModal(null)};document.getElementById('customerClose').onclick=document.getElementById('customerCancel').onclick=closeCustomerModal;document.getElementById('customerSearch').oninput=renderCustomers;document.getElementById('customerReset').onclick=function(){document.getElementById('customerSearch').value='';renderCustomers()};
document.getElementById('customerSelectAll').onchange=function(){var checked=this.checked;customerVisibleRows().forEach(function(x){if(checked)customerSelected.add(x.Id);else customerSelected.delete(x.Id);});renderCustomers();};
document.getElementById('customerBatchAddBtn').onclick=function(){openCustomerBatchModal()};document.getElementById('customerBatchClose').onclick=document.getElementById('customerBatchCancel').onclick=closeCustomerBatchModal;document.getElementById('customerBatchAddRow').onclick=function(){document.getElementById('customerBatchBody').insertAdjacentHTML('afterbegin',customerBatchRowHtml())};
document.getElementById('customerBatchDelBtn').onclick=async function(){return runSubmitOnce(this,async function(){if(!customerSelected.size){tip('请先选择要删除的数据');return}if(!(await deleteConfirm('确定删除选中的 '+customerSelected.size+' 条客户吗？\n删除前系统会自动备份。'))return;await api('/api/customers/batch-delete',{method:'POST',body:JSON.stringify({Ids:Array.from(customerSelected)})});customerSelected.clear();await loadCustomerData();tip('批量删除完成')},'删除中...','正在删除，请稍候...').catch(function(e){tip(e.message)})};
document.getElementById('customerBatchSave').onclick=async function(){return runSubmitOnce(this,async function(){var items=collectCustomerBatchItems();if(!items.length){tip('请至少填写一行客户资料');return}await apiBatchAdd('/api/customers/batch',items,closeCustomerBatchModal,loadCustomerData,{batchBody:document.getElementById('customerBatchBody')})},'保存中...','正在保存，请稍候...').catch(function(e){if(e.message==='请填写客户名称')tip(e.message);else alert('保存失败：'+e.message)})};
document.getElementById('customerImportBtn').onclick=function(){if(!can('customer.import')){tip('无权限操作');return}document.getElementById('customerImportFile').click()};document.getElementById('customerImportFile').onchange=function(){importExcel(this,'/api/customers/import',loadCustomerData)};
document.getElementById('customerBackup').onclick=async function(){if(typeof isAdminUser==='function'&&!isAdminUser()){tip('无权限操作');return}return runSubmitOnce(this,async function(){await(window.erpUiLock?window.erpUiLock.runTask('正在备份，请勿切换页面...',function(){return api('/api/backup',{method:'POST',body:'{}'})}):api('/api/backup',{method:'POST',body:'{}'}));tip('备份完成')},'备份中...','正在备份，请勿切换页面...').catch(function(e){tip(e.message)})};document.getElementById('customerExport').onclick=function(){if(!can('customer.export')){tip('无权限操作');return}downloadCsvExport('/api/customers/export',buildExportFileName('客户管理','.csv'))};
;
</script>
