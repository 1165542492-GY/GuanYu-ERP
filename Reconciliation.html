<style>
#customerReconciliationView{margin:0;padding:0;max-width:100%}
#customerReconciliationView .cr-page-head{margin:0 0 16px}
#customerReconciliationView .cr-page-title{font-size:calc(18px * var(--ui-scale,1));font-weight:700;margin:0 0 6px;color:var(--text)}
#customerReconciliationView .cr-page-desc{margin:0;color:var(--muted);font-size:calc(13px * var(--ui-scale,1));line-height:1.65}
#customerReconciliationView .cr-filter-panel{margin-bottom:16px}
#customerReconciliationView .cr-filter-grid{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 18px}
#customerReconciliationView .cr-filter-item label{display:block;font-size:calc(12px * var(--ui-scale,1));color:#647389;margin-bottom:7px}
#customerReconciliationView .cr-filter-actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding-bottom:2px}
#customerReconciliationView .cr-cards{margin-bottom:16px}
#customerReconciliationView .cr-detail-panel{overflow:hidden}
#crDualScroll{max-width:100%;overflow:hidden}
#customerReconciliationView .cr-statement-table{min-width:960px}
#customerReconciliationView .cr-foot{padding:12px 19px;color:#8390a4;font-size:calc(12px * var(--ui-scale,1));line-height:1.65;border-top:1px solid var(--line)}
</style>
<section class="content" id="customerReconciliationView" style="display:none">
  <div class="cr-page-head">
    <h2 class="cr-page-title">客户对账单</h2>
    <p class="cr-page-desc">按客户和月份查看应收、收款、未收，可导出 Excel。</p>
  </div>
  <div class="panel cr-filter-panel">
    <div class="form" style="padding:16px 19px 18px">
      <div class="formtitle">筛选条件</div>
      <div class="cr-filter-grid">
        <div class="cr-filter-item">
          <label for="crCustomer">客户</label>
          <select id="crCustomer" class="search" style="width:min(280px,100%)"><option value="">请选择客户</option></select>
        </div>
        <div class="cr-filter-item">
          <label for="crMonth">月份</label>
          <input type="month" id="crMonth" class="search" style="width:min(170px,100%)">
        </div>
        <div class="cr-filter-actions">
          <button type="button" class="btn" id="crRefreshBtn">刷新</button>
          <button type="button" class="btn primary" id="crExportBtn">导出 Excel</button>
        </div>
      </div>
    </div>
  </div>
  <div class="cards cr-cards">
    <div class="card"><span class="dot">初</span><div class="card-label">期初应收</div><div class="card-value" id="crOpening">—</div></div>
    <div class="card"><span class="dot">增</span><div class="card-label">本期新增应收</div><div class="card-value" id="crNew">—</div></div>
    <div class="card"><span class="dot">收</span><div class="card-label">本期收款</div><div class="card-value" id="crReceipt">—</div></div>
    <div class="card"><span class="dot">末</span><div class="card-label">期末未收</div><div class="card-value" id="crClosing">—</div></div>
  </div>
  <div class="panel cr-detail-panel">
    <div class="dashboard-head">
      <div class="dashboard-title">对账明细</div>
    </div>
    <div class="dual-scroll" id="crDualScroll">
      <div class="table-scroll-top"><div class="table-scroll-inner"></div></div>
      <div class="tablewrap">
        <table class="data-table biz-table cr-statement-table">
          <thead>
            <tr>
              <th>日期</th>
              <th>类型</th>
              <th>单据编号</th>
              <th>说明</th>
              <th>应收金额</th>
              <th>收款金额</th>
              <th>余额</th>
            </tr>
          </thead>
          <tbody id="crDetailBody">
            <tr><td colspan="7" class="empty">请选择客户和月份后点击「导出 Excel」。</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="cr-foot" id="crHint">统计口径：期初应收 + 本期新增应收 - 本期收款 = 期末未收。导出 Excel 可直接打印或发送给客户。</div>
  </div>
</section>
<script>
(function(){
function mountCustomerReconciliationView(){
  var el=document.getElementById('customerReconciliationView');
  var main=document.querySelector('.main');
  if(el&&main&&el.parentElement!==main)main.appendChild(el);
}
function crInitMonth(){
  var el=document.getElementById('crMonth');
  if(!el)return;
  var d=new Date(),m=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  if(!el.value)el.value=m;
}
function crSelectedCustomerName(){
  var sel=document.getElementById('crCustomer');
  if(!sel||!sel.value)return '';
  var opt=sel.options[sel.selectedIndex];
  return opt?opt.text:'';
}
function crRefreshDualScroll(){
  setTimeout(function(){
    if(typeof bindDualScroll==='function')bindDualScroll('crDualScroll');
    if(typeof refreshPageDualScroll==='function')refreshPageDualScroll('customer-reconciliation');
  },0);
}
async function loadCustomerReconciliationPage(){
  mountCustomerReconciliationView();
  if(!can('reconciliation.customer_view')){tip('无权限访问');return}
  crInitMonth();
  try{
    var list=await api('/api/reconciliation/customers')||[];
    var sel=document.getElementById('crCustomer');
    if(!sel)return;
    var cur=sel.value;
    sel.innerHTML='<option value="">请选择客户</option>'+list.map(function(x){return'<option value="'+safe(x.Id)+'">'+safe(x.Company||x.Code||'-')+'</option>'}).join('');
    if(cur)sel.value=cur;
  }catch(e){tip(e.message||'加载客户列表失败')}
  crRefreshDualScroll();
}
async function exportCustomerReconciliation(btn){
  if(!can('reconciliation.customer_export')){tip('无权限操作');return}
  var cid=document.getElementById('crCustomer')?document.getElementById('crCustomer').value:'';
  var month=document.getElementById('crMonth')?document.getElementById('crMonth').value:'';
  if(!cid){tip('请选择客户');return}
  if(!month){tip('请选择月份');return}
  var name=crSelectedCustomerName()||'客户';
  var ym=month.replace('-','');
  var fallback='客户对账单_'+name+'_'+ym+'.xlsx';
  var url='/api/reconciliation/customer/export?customerId='+encodeURIComponent(cid)+'&month='+encodeURIComponent(month);
  var el=btn||document.getElementById('crExportBtn');
  return runSubmitOnce(el,async function(){await downloadBinaryExport(url,fallback)},'导出中...','正在导出客户对账单，请稍候...');
}
window.mountCustomerReconciliationView=mountCustomerReconciliationView;
window.loadCustomerReconciliationPage=loadCustomerReconciliationPage;
document.addEventListener('DOMContentLoaded',function(){
  mountCustomerReconciliationView();
  crRefreshDualScroll();
  crInitMonth();
  var exportBtn=document.getElementById('crExportBtn');
  if(exportBtn)exportBtn.onclick=function(){return exportCustomerReconciliation(this)};
  var refreshBtn=document.getElementById('crRefreshBtn');
  if(refreshBtn)refreshBtn.onclick=function(){return loadCustomerReconciliationPage()};
});
})();
</script>
